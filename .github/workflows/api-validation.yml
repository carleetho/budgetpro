name: Validate OpenAPI Spec

on:
  pull_request:
    paths:
      - "backend/src/main/java/com/budgetpro/infrastructure/rest/**"
      - "backend/src/main/java/com/budgetpro/infrastructure/config/OpenApiConfig.java"
      - "docs/api/**"
      - "scripts/generate-openapi-spec.sh"
      - ".github/workflows/api-validation.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/src/main/java/com/budgetpro/infrastructure/rest/**"
      - "docs/api/**"
      - "scripts/generate-openapi-spec.sh"
      - ".github/workflows/api-validation.yml"

jobs:
  validate-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: budgetpro_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d budgetpro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/budgetpro_test
      DB_USERNAME: test
      DB_PASSWORD: test
      JWT_SECRET: test-secret-test-secret-test-secret-123456
      JWT_EXPIRATION_HOURS: "24"
      RESEND_API_KEY: test-key
      ADMIN_EMAIL: admin@test.local
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CAPECO_API_KEY: ci-placeholder
      CAPECO_API_URL: http://localhost:8081
      CATALOG_PROVIDER: capeco

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Start application
        working-directory: backend
        run: |
          nohup java -jar target/budgetpro-backend-1.0.0-SNAPSHOT.jar \
            --spring.flyway.validate-on-migrate=false \
            > /tmp/budgetpro-api.log 2>&1 &
          echo $! > /tmp/budgetpro-api.pid

      - name: Generate OpenAPI spec
        run: |
          chmod +x scripts/generate-openapi-spec.sh
          BASELINE_PLACEHOLDER=false
          if grep -q "Placeholder versionado" docs/api/openapi.yaml; then
            BASELINE_PLACEHOLDER=true
          fi
          echo "BASELINE_PLACEHOLDER=${BASELINE_PLACEHOLDER}" >> "$GITHUB_ENV"
          OPENAPI_WAIT_SECS=180 ./scripts/generate-openapi-spec.sh

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/budgetpro-api.pid ]; then
            kill "$(cat /tmp/budgetpro-api.pid)" || true
          fi
          tail -n 80 /tmp/budgetpro-api.log || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate OpenAPI YAML
        run: |
          npx --yes @openapitools/openapi-generator-cli@2.13.4 validate -i docs/api/openapi.yaml

      - name: Fail if committed spec is out of sync
        run: |
          if [ "${BASELINE_PLACEHOLDER}" = "true" ]; then
            echo "Baseline was placeholder; skipping sync gate. Commit the uploaded artifact as docs/api/openapi.yaml."
            exit 0
          fi
          if ! git diff --quiet -- docs/api/openapi.yaml; then
            echo "::error::docs/api/openapi.yaml diverges from runtime /v3/api-docs.yaml"
            echo "Run ./scripts/generate-openapi-spec.sh locally (app up) and commit the result."
            git diff --stat -- docs/api/openapi.yaml
            exit 1
          fi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-yaml
          path: docs/api/openapi.yaml
